<canvas id="stage"></canvas>

<script src="/styles/three.min.js"></script>
<script>
const STYLES = [
  { id: "wire",  name: "WIREFRAME", accent: "#19e6ff" }, { id: "neon",  name: "NEON",      accent: "#ff2fd6" }, { id: "toon",   name: "CARTOON",   accent: "#ffb020" },
  { id: "clay",  name: "CLAY",      accent: "#c9a978" }, { id: "pixel", name: "PIXEL ART", accent: "#8be9fd" }, { id: "ascii",  name: "ASCII",     accent: "#5df08f" },
  { id: "blue",  name: "BLUEPRINT", accent: "#dbe8ff" }, { id: "voxel", name: "VOXEL",     accent: "#f2b21b" }, { id: "paper",  name: "PAPER CUT", accent: "#e59a4b" },
  { id: "glitch", name: "GLITCH",   accent: "#ff2fd6" },
];
// ---------- three.js: one rickshaw, many looks ----------
let W = 1080, H = 1920, S = 1;
const gl = document.createElement("canvas");
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const hemi = new THREE.HemisphereLight(0xffffff, 0x55606c, 0.75); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(4.5, 7, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3.5, right: 3.5, top: 3.5, bottom: -3.5, near: 1, far: 30 }); key.shadow.bias = -0.0006; key.shadow.radius = 5; scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.55); fill.position.set(-5, 3, -2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(-2, 4, -6); scene.add(rim);

const COL = { body: 0x1b7f3b, canopy: 0xf5b82e, glass: 0xbfe3ff, frame: 0x15171b, seat: 0x5a2a2a, chrome: 0xd9dde2, tyre: 0x202327, hub: 0xaab0b6, plate: 0xf4f4f0, lamp: 0xfff1c0, dark: 0x2a2d33 };

// geometry helpers
function rrect(w, h, r) { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; }
function rbox(w, h, d, r = 0.03) { r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001); const g = new THREE.ExtrudeGeometry(rrect(w - 2 * r, h - 2 * r, Math.max(0.002, r)), { depth: d - 2 * r, bevelEnabled: true, bevelSize: r, bevelThickness: r, bevelSegments: 3, curveSegments: 5 }); g.center(); return g; }
function shellShape() { const s = new THREE.Shape(); s.moveTo(-0.65, -1.25); s.lineTo(-0.65, 0.25); s.bezierCurveTo(-0.65, 0.8, -0.46, 1.02, -0.22, 1.13); s.quadraticCurveTo(0, 1.23, 0.22, 1.13); s.bezierCurveTo(0.46, 1.02, 0.65, 0.8, 0.65, 0.25); s.lineTo(0.65, -1.25); s.closePath(); return s; }
function plateTexture(text) { const c = document.createElement("canvas"); c.width = 256; c.height = 96; const x = c.getContext("2d"); x.fillStyle = "#f4f4f0"; x.fillRect(0, 0, 256, 96); x.fillStyle = "#111"; x.font = "bold 54px Menlo, monospace"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, 128, 50); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }

// the rickshaw: a list of parts {geo, role, pos, rot, novox?, open?}
const PARTS = [];
const part = (geo, role, pos, rot, extra) => PARTS.push(Object.assign({ geo, role, pos, rot: rot || [0, 0, 0] }, extra || {}));
part(new THREE.ExtrudeGeometry(shellShape(), { depth: 0.5, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 2, curveSegments: 12 }), "body", [0, 0.95, 0], [Math.PI / 2, 0, 0]);   // lower shell, round tapered nose
part(new THREE.CylinderGeometry(0.37, 0.37, 0.24, 28, 1, true, 0, Math.PI), "body", [0, 0.34, 1.0], [0, 0, Math.PI / 2], { novox: true });   // front mudguard
part(rbox(1.3, 0.3, 0.2, 0.03), "body", [0, 1.1, -1.2]);                                   // rear panel
part(rbox(1.38, 0.5, 0.06, 0.025), "canopy", [0, 1.52, -1.3]);                             // rear soft-top
part(rbox(1.44, 0.07, 2.45, 0.03), "canopy", [0, 1.79, -0.1]);                             // canopy
{ const f = rrect(1.26, 0.72, 0.06); const hole = rrect(1.14, 0.6, 0.04); f.holes.push(hole);
  part(new THREE.ExtrudeGeometry(f, { depth: 0.04, bevelEnabled: false }), "frame", [0, 1.4, 0.98], [-0.28, 0, 0], { novox: true });   // windshield frame
  part(rbox(1.14, 0.6, 0.02, 0.008), "glass", [0, 1.4, 0.98], [-0.28, 0, 0], { novox: true }); }
for (const x of [-0.66, 0.66]) { part(new THREE.CylinderGeometry(0.028, 0.028, 0.78, 12), "frame", [x, 1.4, 0.985], [-0.28, 0, 0]); part(new THREE.CylinderGeometry(0.026, 0.026, 0.76, 12), "frame", [x, 1.38, -0.05]); part(new THREE.CylinderGeometry(0.026, 0.026, 0.76, 12), "frame", [x, 1.38, -1.3]); }
for (const x of [-0.675, 0.675]) part(new THREE.CylinderGeometry(0.02, 0.02, 0.9, 10), "chrome", [x, 1.12, -0.45], [Math.PI / 2, 0, 0]);   // grab bars
part(rbox(1.1, 0.16, 0.52, 0.05), "seat", [0, 1.03, -0.72]); part(rbox(1.1, 0.46, 0.12, 0.05), "seat", [0, 1.26, -1.06], [-0.12, 0, 0]); part(rbox(0.5, 0.12, 0.42, 0.04), "seat", [0, 1.02, 0.28]);
part(new THREE.CylinderGeometry(0.025, 0.025, 0.72, 12), "chrome", [0, 1.18, 0.78], [0, 0, Math.PI / 2]);   // handlebar
for (const x of [-0.33, 0.33]) part(new THREE.CylinderGeometry(0.036, 0.036, 0.14, 12), "frame", [x, 1.18, 0.78], [0, 0, Math.PI / 2]);
part(new THREE.CylinderGeometry(0.03, 0.03, 0.32, 12), "dark", [0, 1.02, 0.82], [-0.3, 0, 0]);               // steering column
part(new THREE.TorusGeometry(0.13, 0.025, 10, 28), "chrome", [0, 0.98, 1.2]); part(new THREE.SphereGeometry(0.115, 24, 16), "lamp", [0, 0.98, 1.19]);   // headlight
for (const x of [-0.8, 0.8]) { part(rbox(0.12, 0.16, 0.03, 0.02), "dark", [x, 1.52, 0.92]); part(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 8), "chrome", [x * 0.92, 1.52, 0.93], [0, 0, Math.PI / 2], { novox: true }); }   // mirrors
part(rbox(0.14, 0.1, 0.12, 0.015), "dark", [0.5, 1.12, 0.72]);                                                // meter
part(rbox(0.3, 0.1, 0.02, 0.01), "plate", [0, 0.6, 1.235]); part(rbox(0.3, 0.1, 0.02, 0.01), "plate", [0, 0.72, -1.3]);
part(rbox(0.7, 0.06, 0.06, 0.03), "dark", [0, 0.47, 1.22]);                                                    // bumper
part(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 12), "dark", [-0.45, 0.4, -1.3], [Math.PI / 2, 0, 0]);       // exhaust
for (const [x, z] of [[0, 1.0], [-0.6, -0.8], [0.6, -0.8]]) { part(new THREE.TorusGeometry(0.235, 0.095, 14, 36), "tyre", [x, 0.33, z], [0, Math.PI / 2, 0]); part(new THREE.CylinderGeometry(0.19, 0.19, 0.14, 24), "hub", [x, 0.33, z], [0, 0, Math.PI / 2]); part(new THREE.CylinderGeometry(0.07, 0.07, 0.16, 16), "dark", [x, 0.33, z], [0, 0, Math.PI / 2]); }

const group = new THREE.Group(); scene.add(group);
const meshes = PARTS.map((p) => { const m = new THREE.Mesh(p.geo); m.position.set(...p.pos); m.rotation.set(...p.rot); m.userData = { role: p.role, novox: !!p.novox }; m.castShadow = p.role !== "glass"; m.receiveShadow = true; group.add(m); return m; });
const plateTex = plateTexture("DL 1R 2026");
// outlines (toon / paper / glitch): back-face shells
const shells = meshes.map((m) => { const s = new THREE.Mesh(m.geometry, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide })); s.position.copy(m.position); s.rotation.copy(m.rotation); s.scale.setScalar(1.04); s.visible = false; group.add(s); return s; });
// edge lines (wire / neon / blueprint)
const edges = meshes.filter((m) => m.userData.role !== "glass").map((m) => { const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 15), new THREE.LineBasicMaterial({ color: 0x19e6ff, transparent: true, opacity: 0.95 })); e.position.copy(m.position); e.rotation.copy(m.rotation); e.visible = false; group.add(e); return e; });
// ground + grid
const ground = new THREE.Mesh(new THREE.CircleGeometry(4.5, 64), new THREE.MeshStandardMaterial({ color: 0xe9e4da, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.y = 0.0; ground.receiveShadow = true; ground.visible = false; scene.add(ground);
const shadowOnly = new THREE.Mesh(new THREE.CircleGeometry(4.5, 64), new THREE.ShadowMaterial({ opacity: 0.28 })); shadowOnly.rotation.x = -Math.PI / 2; shadowOnly.position.y = 0.001; shadowOnly.receiveShadow = true; shadowOnly.visible = false; scene.add(shadowOnly);
const gridH = new THREE.GridHelper(14, 28, 0x19e6ff, 0x19e6ff); gridH.material.transparent = true; gridH.material.opacity = 0.16; gridH.position.y = 0.002; gridH.visible = false; scene.add(gridH);

// voxels: one ray per (y, z) row through the closed parts, inside = between an entry and an exit of the same part
const V = 0.11, voxPos = [], voxRole = [];
{ const ray = new THREE.Raycaster(); const solids = meshes.filter((m) => !m.userData.novox && m.userData.role !== "glass");
  const tmp = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }); solids.forEach((m) => (m.material = tmp)); group.updateMatrixWorld(true);
  for (let y = 0.06; y <= 1.9; y += V) for (let z = -1.45; z <= 1.3; z += V) {
    ray.set(new THREE.Vector3(-2, y, z), new THREE.Vector3(1, 0, 0)); const hits = ray.intersectObjects(solids, false);
    const by = new Map(); hits.forEach((h) => { (by.get(h.object) || by.set(h.object, []).get(h.object)).push(h.point.x); });
    const spans = []; by.forEach((xs, o) => { xs.sort((a, b) => a - b); for (let i = 0; i + 1 < xs.length; i += 2) spans.push([xs[i], xs[i + 1], o.userData.role]); });
    if (!spans.length) continue;
    const used = new Set();
    for (let x = -0.85; x <= 0.85; x += V) { const s = spans.find((sp) => x >= sp[0] && x <= sp[1]); if (s) { voxPos.push([x, y, z]); voxRole.push(s[2]); used.add(s); } }
    spans.forEach((sp) => { if (!used.has(sp)) { const cx = (sp[0] + sp[1]) / 2, gx = -0.85 + Math.round((cx + 0.85) / V) * V; voxPos.push([gx, y, z]); voxRole.push(sp[2]); } });
  }
}
const vox = new THREE.InstancedMesh(new THREE.BoxGeometry(V * 0.94, V * 0.94, V * 0.94), new THREE.MeshStandardMaterial({ roughness: .75 }), voxPos.length);
{ const m = new THREE.Matrix4(), c = new THREE.Color(); voxPos.forEach((p, i) => { m.setPosition(p[0], p[1], p[2]); vox.setMatrixAt(i, m); c.setHex(COL[voxRole[i]]); c.offsetHSL(0, 0, (hash(i) - 0.5) * 0.08); vox.setColorAt(i, c); }); vox.instanceMatrix.needsUpdate = true; vox.castShadow = true; vox.visible = false; group.add(vox); }
function hash(n) { let x = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }

// materials per style
const gradData = new Uint8Array([40, 120, 220, 255]); const grad = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const lighten = (hex, k) => new THREE.Color(hex).lerp(new THREE.Color(0xffffff), k);
const std = (r, o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color: COL[r], roughness: r === "chrome" || r === "hub" ? .25 : r === "glass" ? .1 : .6, metalness: r === "chrome" || r === "hub" ? .9 : 0 }, o || {})); if (r === "glass") Object.assign(m, { transparent: true, opacity: .45 }); if (r === "lamp") { m.emissive = new THREE.Color(0xffe9a0); m.emissiveIntensity = .6; } if (r === "plate") m.map = plateTex; return m; };
const MAT = {
  base:  (r) => std(r, { color: r === "glass" ? 0xdfefff : 0x9aa0a6, roughness: .8, metalness: 0 }),
  wire:  (r) => new THREE.MeshBasicMaterial({ color: 0x19e6ff, transparent: true, opacity: 0.09 }),
  neon:  (r) => new THREE.MeshBasicMaterial({ color: 0x05060a }),
  toon:  (r) => { const m = new THREE.MeshToonMaterial({ color: COL[r], gradientMap: grad }); if (r === "glass") Object.assign(m, { transparent: true, opacity: .55 }); if (r === "plate") m.map = plateTex; return m; },
  clay:  (r) => std(r, { color: lighten(COL[r], .32), roughness: .95, metalness: 0 }),
  pixel: (r) => { const m = new THREE.MeshLambertMaterial({ color: COL[r] }); if (r === "glass") Object.assign(m, { transparent: true, opacity: .6 }); return m; },
  ascii: (r) => new THREE.MeshBasicMaterial({ color: ({ body: 0x8fe39a, canopy: 0xffffff, glass: 0x5fb3ff, frame: 0x3a3a3a, seat: 0x6a4a44, lamp: 0xffffff, chrome: 0xdddddd, tyre: 0x606060, hub: 0xbbbbbb, plate: 0xffffff, dark: 0x505050 })[r] || 0xffffff }),
  blue:  (r) => new THREE.MeshBasicMaterial({ color: 0x2a63c9, transparent: true, opacity: .5 }),
  voxel: (r) => null,
  paper: (r) => { const m = new THREE.MeshBasicMaterial({ color: lighten(COL[r], .18) }); if (r === "glass") Object.assign(m, { transparent: true, opacity: .5 }); return m; },
  glitch:(r) => { const m = new THREE.MeshToonMaterial({ color: COL[r], gradientMap: grad }); if (r === "glass") Object.assign(m, { transparent: true, opacity: .55 }); return m; },
};
const BG = { base: 0x1a1d22, wire: null, neon: null, toon: 0xffd166, clay: 0xf4efe8, pixel: 0x2b2d42, ascii: null, blue: null, voxel: 0x101a2e, paper: 0xf3eee4, glitch: 0x111318 };
const cache = {};
function applyStyle(id) {
  const mats = cache[id] || (cache[id] = {});
  meshes.forEach((m) => { const r = m.userData.role; const f = MAT[id]; const mat = f && f(r); m.visible = !!mat; if (mat) { mats[r] = mats[r] || mat; m.material = mats[r]; } });
  shells.forEach((s) => (s.visible = id === "toon" || id === "paper" || id === "glitch"));
  edges.forEach((e) => { e.visible = id === "wire" || id === "neon" || id === "blue"; e.material.color.setHex(id === "blue" ? 0xffffff : id === "neon" ? 0xff2fd6 : 0x19e6ff); });
  vox.visible = id === "voxel";
  ground.visible = id === "clay" || id === "paper" || id === "toon" || id === "base";
  ground.material.color.setHex({ clay: 0xe9e4da, paper: 0xf3eee4, toon: 0xf6c75a, base: 0x1f232a }[id] || 0xe9e4da);
  ground.material.roughness = 1;
  shadowOnly.visible = id === "voxel" || id === "pixel" || id === "glitch";
  gridH.visible = id === "wire" || id === "neon" || id === "blue"; gridH.material.color.setHex(id === "blue" ? 0xffffff : id === "neon" ? 0xff2fd6 : 0x19e6ff); gridH.material.opacity = id === "blue" ? .22 : .16;
  const bg = BG[id]; scene.background = bg == null ? null : new THREE.Color(bg);
  renderer.toneMapping = (id === "base" || id === "clay" || id === "toon" || id === "pixel" || id === "voxel" || id === "glitch") ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = id === "clay" ? 1.15 : 1.0;
  hemi.intensity = id === "clay" ? 1.0 : 0.75; key.intensity = id === "clay" ? 1.4 : 1.7;
}

// ---------- camera per style: angle start, turn, height, radius, look-at height ----------
const CAM = {
  base:  { a0: 0.75, da: 0.30, h: 2.4, R: 13.0, look: 0.6 },
  wire:  { a0: 0.72, da: 0.36, h: 2.6, R: 13.0, look: 0.6 },
  neon:  { a0: 0.40, da: 0.40, h: 1.5, R: 12.2, look: 0.7 },
  toon:  { a0: 0.95, da: 0.30, h: 2.6, R: 12.6, look: 0.6 },
  clay:  { a0: 0.60, da: 0.30, h: 3.4, R: 12.0, look: 0.55 },
  pixel: { a0: 0.82, da: 0.32, h: 2.4, R: 12.6, look: 0.6 },
  ascii: { a0: 1.0, da: 0.3, h: 2.2, R: 13.2, look: 0.65 },
  blue:  { a0: 1.5708, da: 0.0, h: 1.3, R: 14.2, look: 0.85 },
  voxel: { a0: 0.8, da: 0.42, h: 2.9, R: 12.6, look: 0.6 },
  paper: { a0: 0.42, da: 0.30, h: 1.9, R: 12.6, look: 0.65 },
  glitch:{ a0: 0.90, da: 0.46, h: 2.1, R: 11.2, look: 0.75 },
};
let SMALL = [W, H];
function renderStyle(id, t, w, h, ang, cam) {
  const c = cam || CAM[id] || CAM.base, loc = ang == null ? 0 : 0;
  const rows = h >= 400 ? 107 : 26, cols = Math.round(rows * w / (0.75 * h)), prow = h >= 400 ? 228 : 56;
  const lineStyle = id === "wire" || id === "neon" || id === "blue";
  const small = id === "pixel" ? [Math.round(prow * w / h), prow] : id === "ascii" ? [cols, rows] : lineStyle ? [w, h] : [w * S, h * S];
  SMALL = small; renderer.setSize(small[0], small[1], false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  applyStyle(id);
  const a = ang, R = (w > h ? c.R * 0.62 : c.R), bob = Math.sin(t * 1.3) * 0.05;
  camera.position.set(Math.sin(a) * R, c.h + bob, Math.cos(a) * R); camera.lookAt(0, c.look, 0);
  renderer.setClearColor(0x000000, scene.background ? 1 : 0);
  renderer.render(scene, camera);
}
// angle + dolly for a style at local time `loc` (seconds into its shot)

const N = STYLES.length, SEG_PAGE = 2.14, sub = document.getElementById("sub"), txt = document.getElementById("txt"), chips = document.getElementById("chips");
